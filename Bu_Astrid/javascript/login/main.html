<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="container">
      <form id="loginForm">
        <h2>Formulir Login</h2>
        <label for="nama">Nama :</label>
        <input type="text" id="nama" placeholder="masukkan nama" /><br />

        <label for="email">Email :</label>
        <input type="email" id="email" placeholder="masukkan email" /><br />

        <label for="pw">Password :</label>
        <input type="password" id="pw" placeholder="masukkan password" /><br />

        <input type="submit" value="Login">
        <div class="textbox" id="textbox"></div>
      </form>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
